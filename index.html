<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>US States Adventure!</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', Tahoma, sans-serif;
  background: radial-gradient(ellipse at top, #0d1b3e 0%, #071023 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 10px 30px;
  color: #fff;
}

header {
  text-align: center;
  margin-bottom: 14px;
}
header h1 {
  font-size: clamp(1.6rem, 4vw, 2.5rem);
  background: linear-gradient(135deg, #ffd700, #ff9500, #ff6b35);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 1px;
  text-shadow: none;
  filter: drop-shadow(0 0 18px rgba(255,200,0,0.35));
}
header p { color: #7eb8f7; font-size: 0.95rem; margin-top: 4px; }

.card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 16px;
  width: 100%;
  max-width: 1020px;
  box-shadow: 0 24px 64px rgba(0,0,0,0.6);
}

/* ── Mode Buttons ── */
.modes {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  margin-bottom: 14px;
}
.mode-btn {
  background: rgba(255,255,255,0.07);
  border: 1.5px solid rgba(255,255,255,0.15);
  color: #b0d4ff;
  border-radius: 50px;
  padding: 7px 20px;
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
  font-family: inherit;
}
.mode-btn:hover { background: rgba(255,255,255,0.15); }
.mode-btn.active {
  background: linear-gradient(135deg, #7b5fff, #e040fb);
  border-color: transparent;
  color: #fff;
  box-shadow: 0 4px 18px rgba(180,80,255,0.45);
}

/* ── Scoreboard ── */
.scoreboard {
  display: flex;
  justify-content: space-around;
  flex-wrap: wrap;
  gap: 8px;
  background: rgba(0,0,0,0.3);
  border-radius: 14px;
  padding: 10px 6px;
  margin-bottom: 12px;
}
.score-cell { text-align: center; min-width: 65px; }
.score-cell .lbl { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; color: #6899bb; }
.score-cell .val { font-size: 1.55rem; font-weight: 700; color: #fff; line-height: 1.2; }

/* ── Progress ── */
.progress-wrap { margin-bottom: 12px; }
.progress-lbl { font-size: 0.7rem; color: #5588aa; margin-bottom: 4px; }
.progress-track {
  height: 8px;
  background: rgba(255,255,255,0.08);
  border-radius: 99px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #00e676, #00bcd4);
  border-radius: 99px;
  transition: width .6s ease;
  box-shadow: 0 0 8px rgba(0,220,120,0.5);
  width: 0%;
}

/* ── Question Box ── */
.question-box {
  min-height: 58px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  background: linear-gradient(135deg, rgba(123,95,255,.2), rgba(224,64,251,.2));
  border: 1.5px solid rgba(180,100,255,.35);
  border-radius: 16px;
  padding: 12px 20px;
  font-size: clamp(1rem, 2.5vw, 1.28rem);
  font-weight: 700;
  text-align: center;
  color: #fff;
  margin-bottom: 12px;
}
.question-box .hl { color: #ffd700; font-size: 1.15em; }
.hint-btn {
  background: rgba(255,215,0,.15);
  border: 1px solid rgba(255,215,0,.35);
  color: #ffd700;
  border-radius: 20px;
  padding: 4px 13px;
  font-size: 0.75rem;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: background .2s;
  white-space: nowrap;
}
.hint-btn:hover { background: rgba(255,215,0,.28); }

/* ── Map ── */
.map-wrap {
  position: relative;
  background: linear-gradient(170deg, #0c2544 0%, #071a35 100%);
  border-radius: 16px;
  border: 1.5px solid rgba(80,160,255,.25);
  overflow: hidden;
  box-shadow: inset 0 0 50px rgba(0,0,0,.5);
}
#map-svg { display: block; width: 100%; }

.state-shape {
  stroke: #0c2544;
  stroke-width: 0.5px;
  cursor: pointer;
  transition: filter .15s;
}
.state-shape:hover { filter: brightness(1.55) drop-shadow(0 0 6px rgba(100,200,255,.7)); }
.state-shape.st-default  { fill: #2e7d52; }
.state-shape.st-hover    { fill: #1565c0; }
.state-shape.st-found    { fill: #1b5e20; }
.state-shape.st-target   { fill: #f9a825; animation: stateGlow 1s ease-in-out infinite alternate; }
.state-shape.st-correct  { fill: #00c853; animation: stateCorrect .5s ease; }
.state-shape.st-wrong    { fill: #c62828; animation: stateWrong .55s ease; }

@keyframes stateGlow {
  from { filter: drop-shadow(0 0 5px #ffd700); }
  to   { filter: drop-shadow(0 0 16px #ffd700) brightness(1.25); }
}
@keyframes stateCorrect {
  0%   { filter: brightness(1); }
  50%  { filter: brightness(2.5) drop-shadow(0 0 12px #00ff88); }
  100% { filter: brightness(1); }
}
@keyframes stateWrong {
  0%,100% { transform: translateX(0); }
  25%     { transform: translateX(-5px); }
  75%     { transform: translateX(5px); }
}

.state-borders {
  fill: none;
  stroke: rgba(255,255,255,.18);
  stroke-width: 0.7px;
  pointer-events: none;
}
.state-label {
  font-size: 7px;
  font-weight: 700;
  fill: rgba(255,255,255,.75);
  pointer-events: none;
  user-select: none;
  text-anchor: middle;
  dominant-baseline: middle;
  text-shadow: 0 1px 3px rgba(0,0,0,.9);
}

/* ── Capital star markers ── */
.capital-star {
  pointer-events: none;
  user-select: none;
  font-size: 9px;
  text-anchor: middle;
  dominant-baseline: middle;
  fill: #ffd700;
  filter: drop-shadow(0 0 3px rgba(255,200,0,.9)) drop-shadow(0 0 1px rgba(0,0,0,.8));
  animation: starPulse 2.5s ease-in-out infinite;
}
@keyframes starPulse {
  0%,100% { filter: drop-shadow(0 0 2px rgba(255,200,0,.7)) drop-shadow(0 0 1px rgba(0,0,0,.8)); }
  50%     { filter: drop-shadow(0 0 6px rgba(255,220,0,1))  drop-shadow(0 0 1px rgba(0,0,0,.8)); }
}

/* ── Tooltip ── */
.tooltip {
  position: absolute;
  background: rgba(5,18,40,.96);
  border: 1px solid rgba(100,180,255,.4);
  border-radius: 12px;
  padding: 10px 14px;
  pointer-events: none;
  z-index: 50;
  max-width: 230px;
  display: none;
  box-shadow: 0 6px 24px rgba(0,0,0,.6);
  font-size: 0.82rem;
  line-height: 1.5;
}
.tooltip .tt-name { color: #ffd700; font-weight: 700; font-size: 1em; margin-bottom: 3px; }
.tooltip .tt-cap  { color: #4fc3f7; }
.tooltip .tt-fact { color: #9dc8e8; margin-top: 5px; font-size: 0.92em; }

/* ── Capital Options ── */
.options-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 12px;
}
.opt-btn {
  background: rgba(255,255,255,.07);
  border: 1.5px solid rgba(255,255,255,.14);
  color: #cce8ff;
  border-radius: 12px;
  padding: 11px 14px;
  font-size: clamp(.82rem, 2vw, 1rem);
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  text-align: left;
  transition: all .18s;
}
.opt-btn:hover:not(:disabled) {
  background: rgba(80,160,255,.2);
  border-color: rgba(80,160,255,.5);
  transform: translateY(-2px);
}
.opt-btn.opt-correct { background: rgba(0,200,83,.25); border-color: #00e676; color: #00e676; }
.opt-btn.opt-wrong   { background: rgba(255,23,68,.25);  border-color: #ff1744; color: #ff5c7a; }
.opt-btn:disabled    { cursor: not-allowed; }

/* ── Fact Box ── */
.fact-box {
  display: none;
  background: linear-gradient(135deg, rgba(0,188,140,.12), rgba(0,120,200,.12));
  border: 1.5px solid rgba(0,220,160,.3);
  border-radius: 16px;
  padding: 16px 18px;
  margin-top: 12px;
  animation: slideUp .4s ease;
}
@keyframes slideUp {
  from { opacity:0; transform: translateY(10px); }
  to   { opacity:1; transform: translateY(0); }
}
.fact-box .fb-header   { color: #ffd700; font-weight: 700; font-size: .92rem; margin-bottom: 6px; }
.fact-box .fb-name     { color: #4fc3f7; font-size: 1.1rem; font-weight: 700; margin-bottom: 3px; }
.fact-box .fb-capital  { color: #a5d6f7; font-size: .92rem; margin-bottom: 10px; }
.fact-box .fb-fact     { color: #c8e6ff; font-size: .9rem; line-height: 1.6; margin-bottom: 12px; }
.next-btn {
  background: linear-gradient(135deg, #00b96b, #00e676);
  color: #001a0e;
  border: none;
  border-radius: 50px;
  padding: 10px 28px;
  font-size: .98rem;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: transform .18s, box-shadow .18s;
  box-shadow: 0 4px 16px rgba(0,200,80,.4);
}
.next-btn:hover { transform: scale(1.05); box-shadow: 0 6px 22px rgba(0,200,80,.6); }

/* ── Game Over ── */
.gameover {
  display: none;
  text-align: center;
  padding: 30px 16px;
}
.gameover h2 { font-size: 2rem; color: #ffd700; margin-bottom: 12px; filter: drop-shadow(0 0 16px rgba(255,215,0,.6)); }
.gameover p  { color: #9dc8e8; font-size: 1.05rem; line-height: 1.9; margin-bottom: 22px; }

/* ── Confetti ── */
.confetti {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  border-radius: 3px;
  animation: confFall linear forwards;
}
@keyframes confFall {
  0%   { transform: translateY(-40px) rotate(0deg) scale(1); opacity:1; }
  85%  { opacity:1; }
  100% { transform: translateY(105vh) rotate(800deg) scale(.4); opacity:0; }
}

/* ── Flash overlay ── */
.flash {
  position: fixed; inset: 0;
  pointer-events: none; z-index: 9998;
  animation: flashOut .45s ease forwards;
}
@keyframes flashOut { from { opacity:.45; } to { opacity:0; } }

/* ── Streak badge ── */
.streak-badge {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  background: linear-gradient(135deg, #ffd700, #ff9500);
  color: #1a0800;
  font-size: 1.7rem; font-weight: 800;
  padding: 18px 38px;
  border-radius: 20px;
  z-index: 9997;
  pointer-events: none;
  text-align: center;
  box-shadow: 0 0 50px rgba(255,200,0,.7);
  animation: badgePop 1.6s ease forwards;
}
@keyframes badgePop {
  0%   { transform: translate(-50%,-50%) scale(.2); opacity:0; }
  20%  { transform: translate(-50%,-50%) scale(1.15); opacity:1; }
  40%  { transform: translate(-50%,-50%) scale(1); }
  75%  { opacity:1; }
  100% { transform: translate(-50%,-50%) scale(1.05); opacity:0; }
}

/* ── Loading ── */
#loading {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(7,16,35,.9);
  border-radius: 16px;
  z-index: 10;
  font-size: 1.1rem; color: #7eb8f7;
  flex-direction: column; gap: 14px;
}
.spinner {
  width: 40px; height: 40px;
  border: 4px solid rgba(100,180,255,.2);
  border-top-color: #4fc3f7;
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 500px) {
  .options-grid { grid-template-columns: 1fr; }
}

/* ── Physical Features ── */
.lake-shape {
  fill: rgba(55, 130, 200, 0.52);
  stroke: rgba(110, 180, 240, 0.65);
  stroke-width: 0.6px;
}
.river-path {
  fill: none;
  stroke: rgba(80, 170, 230, 0.72);
  stroke-width: 1.3px;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.lake-label {
  font-size: 6px;
  font-weight: 700;
  fill: rgba(170, 215, 255, 0.88);
  font-style: italic;
  text-anchor: middle;
  dominant-baseline: middle;
  pointer-events: none;
  user-select: none;
}
.river-label {
  font-size: 5.5px;
  fill: rgba(130, 195, 240, 0.82);
  font-style: italic;
  text-anchor: middle;
  dominant-baseline: middle;
  pointer-events: none;
  user-select: none;
}
.mountain-label {
  font-size: 6px;
  font-weight: 700;
  fill: rgba(225, 205, 160, 0.92);
  text-anchor: middle;
  dominant-baseline: middle;
  pointer-events: none;
  user-select: none;
}
/* Features toggle button */
.toggle-btn {
  background: rgba(255,200,80,.1);
  border: 1.5px solid rgba(255,200,80,.28);
  color: #ffd88a;
  border-radius: 50px;
  padding: 7px 20px;
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
  font-family: inherit;
}
.toggle-btn:hover { background: rgba(255,200,80,.22); }
.toggle-btn.active {
  background: linear-gradient(135deg, #a07828, #d4a040);
  border-color: transparent;
  color: #fff;
  box-shadow: 0 4px 18px rgba(190,140,20,.45);
}
</style>
</head>
<body>

<header>
  <h1>&#127758; US States Adventure!</h1>
  <p>Learn all 50 states and their capitals!</p>
</header>

<div class="card">

  <div class="modes">
    <button class="mode-btn active" data-mode="find"    onclick="setMode('find')">&#128269; Find the State</button>
    <button class="mode-btn"        data-mode="capital" onclick="setMode('capital')">&#127963; Capital Quiz</button>
    <button class="mode-btn"        data-mode="explore" onclick="setMode('explore')">&#127758; Explore &amp; Learn</button>
    <button class="toggle-btn active" id="feat-btn"     onclick="toggleFeatures()">&#127956; Landmarks</button>
  </div>

  <div class="scoreboard">
    <div class="score-cell"><div class="lbl">Score</div><div class="val" id="el-score">0</div></div>
    <div class="score-cell"><div class="lbl">Streak</div><div class="val" id="el-streak">0</div></div>
    <div class="score-cell"><div class="lbl">Lives</div><div class="val" id="el-lives">&#10084;&#10084;&#10084;</div></div>
    <div class="score-cell"><div class="lbl">Done</div><div class="val" id="el-done">0/50</div></div>
  </div>

  <div class="progress-wrap">
    <div class="progress-lbl" id="el-pct">Progress: 0%</div>
    <div class="progress-track"><div class="progress-fill" id="el-fill"></div></div>
  </div>

  <div class="question-box" id="el-question">Loading the map&hellip;</div>

  <div class="map-wrap" id="map-wrap">
    <div id="loading"><div class="spinner"></div>Loading accurate map data&hellip;</div>
    <svg id="map-svg" viewBox="0 0 975 610"></svg>
    <div class="tooltip" id="tooltip">
      <div class="tt-name" id="tt-name"></div>
      <div class="tt-cap"  id="tt-cap"></div>
      <div class="tt-fact" id="tt-fact"></div>
    </div>
  </div>

  <div id="el-options"></div>

  <div class="fact-box" id="el-fact">
    <div class="fb-header">&#127775; Fun Fact!</div>
    <div class="fb-name"    id="fb-name"></div>
    <div class="fb-capital" id="fb-cap"></div>
    <div class="fb-fact"    id="fb-fact"></div>
    <button class="next-btn" id="el-next" onclick="nextQuestion()">Next State &#8594;</button>
  </div>

  <div class="gameover" id="el-gameover">
    <h2>&#127881; Game Over!</h2>
    <p id="el-final"></p>
    <button class="next-btn" onclick="restart()">Play Again &#8635;</button>
  </div>

</div><!-- .card -->

<script>
// ─────────────────────────────────────────────
//  State data: capitals + fun facts
// ─────────────────────────────────────────────
const STATE_DATA = {
  Alabama:         { abbr:"AL", capital:"Montgomery",     capitalCoords:[-86.2792, 32.3617], fact:"Alabama has more species of freshwater fish than any other state — over 300! It's truly a fish paradise. &#128031;" },
  Alaska:          { abbr:"AK", capital:"Juneau",         capitalCoords:[-134.4197,58.3005], fact:"Alaska is so vast it would cover 1/5 of the lower 48 states, and has more coastline than ALL other US states combined! &#127956;" },

function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function beep(freq, dur, wave='sine', vol=0.25) {
  try {
    const c = getCtx(), o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination);
    o.frequency.value = freq; o.type = wave;
    g.gain.setValueAtTime(vol, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
    o.start(c.currentTime); o.stop(c.currentTime + dur);
  } catch(e){}
}
function sfxCorrect() { beep(523,.08); setTimeout(()=>beep(659,.08),90); setTimeout(()=>beep(784,.18),180); }
function sfxWrong()   { beep(200,.35,'sawtooth',.2); }
function sfxStreak()  { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.14),i*80)); }

function stateColor(name) {
  return STATE_COLORS[name] || '#4a7a5a';
}

async function initMap() {
  svgSel = d3.select('#map-svg')
    .attr('viewBox', `0 0 ${WIDTH} ${HEIGHT}`)
    .attr('preserveAspectRatio', 'xMidYMid meet');

  let us;
  try {
    us = await d3.json('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json');
  } catch(e) {
    document.getElementById('loading').innerHTML =
      '<span style="color:#ff6b6b">&#9888; Could not load map data.<br>Check your internet connection.</span>';
    return;
  }

  projection = d3.geoAlbersUsa()
    .scale(1280)
    .translate([WIDTH / 2, HEIGHT / 2]);

  geoPathFn = d3.geoPath().projection(projection);

  const features  = topojson.feature(us, us.objects.states).features;
  const borders   = topojson.mesh(us, us.objects.states, (a, b) => a !== b);
  const outline   = topojson.merge(us, us.objects.states.geometries);

  // Build feature map: name → feature
  features.forEach(f => {
    const name = f.properties.name;
    if (STATE_DATA[name]) featureMap[name] = f;
  });

  // Ocean-ish background
  svgSel.append('path')
    .datum(outline)
    .attr('d', geoPathFn)
    .attr('fill', 'none')
    .attr('stroke', 'rgba(100,180,255,.15)')
    .attr('stroke-width', 1.5);

  // State fills
  svgSel.selectAll('.state-shape')
    .data(features)
    .join('path')
      .attr('class', 'state-shape st-default')
      .attr('id',    d => 'st-' + d.properties.name.replace(/\s+/g,'_'))
      .attr('d',     geoPathFn)
      .attr('fill',  d => stateColor(d.properties.name))
      .on('click',      (e, d) => onMapClick(d.properties.name))
      .on('mouseenter', (e, d) => onHover(d.properties.name, e))
      .on('mousemove',  (e)    => moveTooltip(e))
      .on('mouseleave', ()     => hideTooltip());

  // State borders (drawn on top for crisp lines)
  svgSel.append('path')
    .datum(borders)
    .attr('class', 'state-borders')
    .attr('d', geoPathFn);

  // Physical features (lakes, rivers, mountains) — above borders, below labels
  addPhysicalFeatures();

  // State abbreviation labels
  svgSel.selectAll('.state-label')
    .data(features.filter(f => STATE_DATA[f.properties.name]))
    .join('text')
      .attr('class', 'state-label')
      .attr('transform', d => {
        const c = geoPathFn.centroid(d);
        return isNaN(c[0]) ? 'translate(-999,-999)' : `translate(${c})`;
      })
      .text(d => STATE_DATA[d.properties.name]?.abbr || '');

  // Capital star markers — project each capital's real lat/lon onto the map
  const capitalData = Object.entries(STATE_DATA)
    .map(([name, d]) => ({ name, capital: d.capital, coords: d.capitalCoords }))
    .filter(d => {
      const px = projection(d.coords);
      return px !== null; // geoAlbersUsa returns null if outside projection area
    });

  // Outer glow ring
  svgSel.selectAll('.capital-glow')
    .data(capitalData)
    .join('circle')
      .attr('class', 'capital-glow')
      .attr('cx', d => projection(d.coords)[0])
      .attr('cy', d => projection(d.coords)[1])
      .attr('r', 5)
      .attr('fill', 'none')
      .attr('stroke', 'rgba(255,215,0,.35)')
      .attr('stroke-width', 1.5)
      .attr('pointer-events', 'none');

  // Star ★ character at each capital
  svgSel.selectAll('.capital-star')
    .data(capitalData)
    .join('text')
      .attr('class', 'capital-star')
      .attr('x', d => projection(d.coords)[0])
      .attr('y', d => projection(d.coords)[1])
      .attr('data-state', d => d.name)
      .text('★');

  // Remove loading overlay
  document.getElementById('loading').style.display = 'none';

  // Start game
  resetGame();
  nextQuestion();
}

// ─────────────────────────────────────────────
//  Tooltip
// ─────────────────────────────────────────────
function onHover(name, e) {
  if (mode !== 'explore') return;
  const d = STATE_DATA[name];
  if (!d) return;
  document.getElementById('tt-name').textContent = name;
  document.getElementById('tt-cap').textContent  = '🏛 Capital: ' + d.capital;
  document.getElementById('tt-fact').innerHTML   = d.fact;
  const tt = document.getElementById('tooltip');
  tt.style.display = 'block';
  moveTooltip(e);
}
function moveTooltip(e) {
  const tt   = document.getElementById('tooltip');
  const wrap = document.getElementById('map-wrap');
  const rect = wrap.getBoundingClientRect();
  let x = e.clientX - rect.left + 14;
  let y = e.clientY - rect.top  + 14;
  if (x + 240 > rect.width)  x = e.clientX - rect.left - 245;
  if (y + 160 > rect.height) y = e.clientY - rect.top  - 165;
  tt.style.left = Math.max(0, x) + 'px';
  tt.style.top  = Math.max(0, y) + 'px';
}
function hideTooltip() {
  document.getElementById('tooltip').style.display = 'none';
}

// ─────────────────────────────────────────────
//  State shape helpers
// ─────────────────────────────────────────────
function stateEl(name) {
  return document.getElementById('st-' + name.replace(/\s+/g,'_'));
}
function setStateClass(name, cls) {
  const el = stateEl(name);
  if (!el) return;
  el.classList.remove('st-default','st-found','st-target','st-correct','st-wrong');
  el.classList.add(cls);
}
function resetStateClass(name) {
  const el = stateEl(name);
  if (!el) return;
  el.classList.remove('st-default','st-found','st-target','st-correct','st-wrong');
  el.classList.add(done.has(name) ? 'st-found' : 'st-default');
}

// ─────────────────────────────────────────────
//  Mode switching
// ─────────────────────────────────────────────
function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === m);
  });
  if (m === 'explore') {
    resetGameVisuals();
    setQ('&#127758; Hover or click any state to explore facts!');
    document.getElementById('el-options').innerHTML = '';
    document.getElementById('el-fact').style.display = 'none';
    document.getElementById('el-gameover').style.display = 'none';
  } else {
    resetGame();
    nextQuestion();
  }
}

// ─────────────────────────────────────────────
//  Game flow
// ─────────────────────────────────────────────
function resetGame() {
  score = 0; streak = 0; lives = 3;
  done.clear(); awaitNext = false; hintUsed = false;
  queue = shuffle(Object.keys(STATE_DATA));
  updateHUD();
  resetGameVisuals();
  document.getElementById('el-options').innerHTML  = '';
  document.getElementById('el-fact').style.display = 'none';
  document.getElementById('el-gameover').style.display = 'none';
}
function resetGameVisuals() {
  Object.keys(STATE_DATA).forEach(name => resetStateClass(name));
}

function nextQuestion() {
  awaitNext = false; hintUsed = false;
  document.getElementById('el-fact').style.display = 'none';
  document.getElementById('el-options').innerHTML  = '';
  // clear any target/correct highlights
  if (current) resetStateClass(current);

  if (!queue.length) { endGame(); return; }
  current = queue.shift();

  if (mode === 'find') {
    setQ('&#128269; Find <span class="hl">' + current + '</span> on the map!',
         '<button class="hint-btn" onclick="giveHint()">&#128161; Hint</button>');
  } else if (mode === 'capital') {
    setQ('&#127963; What is the capital of <span class="hl">' + current + '</span>?');
    buildOptions();
  }
  updateHUD();
}

function setQ(html, extra='') {
  document.getElementById('el-question').innerHTML = html + (extra ? ' ' + extra : '');
}

function giveHint() {
  if (hintUsed || !current || awaitNext) return;
  hintUsed = true;
  setStateClass(current, 'st-target');
  document.querySelectorAll('.hint-btn').forEach(b => b.remove());
  score = Math.max(0, score - 3);
  updateHUD();
}

// ─────────────────────────────────────────────
//  Capital quiz
// ─────────────────────────────────────────────
function buildOptions() {
  const correct = STATE_DATA[current].capital;
  const pool    = Object.values(STATE_DATA).map(d => d.capital).filter(c => c !== correct);
  const opts    = shuffle([correct, ...shuffle(pool).slice(0, 3)]);
  document.getElementById('el-options').innerHTML =
    '<div class="options-grid">' +
    opts.map(o =>
      `<button class="opt-btn" onclick="checkCap(this,'${esc(o)}','${esc(correct)}')">`+
      `&#127963; ${o}</button>`
    ).join('') + '</div>';
}
function esc(s) { return s.replace(/'/g,"\\'"); }

function checkCap(btn, selected, correct) {
  if (awaitNext) return;
  document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
  if (selected === correct) {
    btn.classList.add('opt-correct');
    correct_answer();
  } else {
    btn.classList.add('opt-wrong');
    document.querySelectorAll('.opt-btn').forEach(b => {
      if (b.textContent.includes(correct)) b.classList.add('opt-correct');
    });
    wrong_answer();
  }
  setStateClass(current, 'st-found');
  showFact();
  awaitNext = true;
}

// ─────────────────────────────────────────────
//  Map click (find mode + explore)
// ─────────────────────────────────────────────
function onMapClick(name) {
  if (mode === 'explore') {
    Object.keys(STATE_DATA).forEach(n => resetStateClass(n));
    setStateClass(name, 'st-correct');
    if (STATE_DATA[name]) {
      showFact(name);
      setQ('&#128205; <span class="hl">' + name + '</span> — Capital: ' + STATE_DATA[name].capital);
      document.getElementById('el-next').style.display = 'none';
    }
    return;
  }
  if (mode !== 'find' || awaitNext || !current) return;

  if (name === current) {
    setStateClass(name, 'st-correct');
    correct_answer();
    showFact();
    awaitNext = true;
  } else {
    setStateClass(name, 'st-wrong');
    setTimeout(() => resetStateClass(name), 700);
    wrong_answer();
    if (lives <= 0) {
      setStateClass(current, 'st-target');
      showFact();
      awaitNext = true;
    }
  }
}

// ─────────────────────────────────────────────
//  Scoring
// ─────────────────────────────────────────────
function correct_answer() {
  sfxCorrect();
  streak++;
  const bonus = hintUsed ? 0 : Math.min(streak - 1, 4) * 2;
  score += hintUsed ? 5 : 10 + bonus;
  done.add(current);
  updateHUD();
  flashScreen('rgba(0,220,100,.13)');
  if (streak > 0 && streak % 5 === 0) {
    sfxStreak(); launchConfetti(); showStreakBadge(streak);
  } else if (streak >= 3) {
    launchConfetti(12);
  }
}
function wrong_answer() {
  sfxWrong();
  streak = 0; lives--;
  updateHUD();
  flashScreen('rgba(220,30,30,.15)');
  if (lives <= 0) setTimeout(endGame, 2800);
}

// ─────────────────────────────────────────────
//  Fact display
// ─────────────────────────────────────────────
function showFact(name) {
  const key = name || current;
  const d   = STATE_DATA[key];
  if (!d) return;
  document.getElementById('fb-name').innerHTML   = '&#127758; ' + key;
  document.getElementById('fb-cap').innerHTML    = '&#127963; Capital: <strong>' + d.capital + '</strong>';
  document.getElementById('fb-fact').innerHTML   = d.fact;
  document.getElementById('el-next').style.display = (mode === 'explore') ? 'none' : 'inline-block';
  document.getElementById('el-fact').style.display = 'block';
}

// ─────────────────────────────────────────────
//  HUD
// ─────────────────────────────────────────────
function updateHUD() {
  document.getElementById('el-score').textContent  = score;
  document.getElementById('el-streak').innerHTML   = streak >= 3 ? streak + ' &#128293;' : streak;
  const h = '&#10084;'.repeat(Math.max(0,lives)) + '&#129291;'.repeat(Math.max(0,3-lives));
  document.getElementById('el-lives').innerHTML    = h;
  const total = Object.keys(STATE_DATA).length;
  const n     = done.size;
  document.getElementById('el-done').textContent   = n + '/50';
  const pct = Math.round(n / total * 100);
  document.getElementById('el-fill').style.width   = pct + '%';
  document.getElementById('el-pct').textContent    = 'Progress: ' + pct + '%';
}

// ─────────────────────────────────────────────
//  End / restart
// ─────────────────────────────────────────────
function endGame() {
  let msg;
  if      (score >= 400) msg = '&#127775; Incredible! You\'re a geography genius!';
  else if (score >= 250) msg = '&#128293; Amazing! You really know your states!';
  else if (score >= 100) msg = '&#128077; Great job! Keep practicing and you\'ll ace it!';
  else                   msg = '&#128170; Nice effort! Play again to improve!';

  document.getElementById('el-final').innerHTML =
    `&#127881; Final Score: <strong>${score}</strong> points<br>
     States completed: ${done.size} / 50<br><br>${msg}`;
  document.getElementById('el-gameover').style.display = 'block';
  document.getElementById('el-fact').style.display     = 'none';
  document.getElementById('el-question').style.display = 'none';
  launchConfetti(70); sfxStreak();
}
function restart() {
  document.getElementById('el-gameover').style.display  = 'none';
  document.getElementById('el-question').style.display  = 'flex';
  resetGame();
  nextQuestion();
}

function launchConfetti(n=45) {
  const pal = ['#ff6b6b','#feca57','#48dbfb','#ff9ff3','#54a0ff','#5f27cd','#00d2d3','#ff9f43','#10ac84','#01aae8'];
  for (let i = 0; i < n; i++) {
    setTimeout(() => {
      const el  = document.createElement('div');
      el.className   = 'confetti';
      el.style.left  = (Math.random() * 100) + 'vw';
      el.style.top   = '-30px';
      el.style.background  = pal[Math.floor(Math.random() * pal.length)];
      const sz = Math.random() * 10 + 6;
      el.style.width  = sz + 'px';
      el.style.height = sz + 'px';
      el.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
      el.style.animationDuration = (Math.random() * 2.5 + 1.8) + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4500);
    }, i * 40);
  }
}
function flashScreen(color) {
  const el = document.createElement('div');
  el.className  = 'flash';
  el.style.background = color;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 500);
}
function showStreakBadge(n) {
  const el = document.createElement('div');
  el.className = 'streak-badge';
  el.innerHTML = '&#128293; ' + n + ' in a row!<br><span style="font-size:.65em">+' + (n * 2) + ' bonus pts!</span>';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1700);
}

// ─────────────────────────────────────────────
//  Utilities
// ─────────────────────────────────────────────
function shuffle(a) {
  const arr = [...a];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ─────────────────────────────────────────────
//  Physical Features Rendering
// ─────────────────────────────────────────────
function addPhysicalFeatures() {
  featuresGroup = svgSel.append('g')
    .attr('id', 'features-layer')
    .attr('pointer-events', 'none');

  // ── Lakes ──
  const lakeG = featuresGroup.append('g');
  LAKES_DATA.forEach(lake => {
    const pts = lake.coords.map(c => projection(c)).filter(p => p && !isNaN(p[0]));
    if (pts.length < 3) return;
    lakeG.append('path')
      .attr('d', 'M' + pts.map(p => p.join(',')).join('L') + 'Z')
      .attr('class', 'lake-shape');
    const lp = projection(lake.labelCoord);
    if (lp && !isNaN(lp[0]))
      lakeG.append('text').attr('x', lp[0]).attr('y', lp[1])
        .attr('class', 'lake-label').text(lake.name);
  });

  // ── Rivers ──
  const riverG = featuresGroup.append('g');
  const lineGen = d3.line().curve(d3.curveCatmullRom.alpha(0.5));
  RIVERS_DATA.forEach(river => {
    const pts = river.coords.map(c => projection(c)).filter(p => p && !isNaN(p[0]));
    if (pts.length < 2) return;
    riverG.append('path').attr('d', lineGen(pts)).attr('class', 'river-path');
    const lp = projection(river.labelCoord);
    if (lp && !isNaN(lp[0]))
      riverG.append('text').attr('x', lp[0]).attr('y', lp[1])
        .attr('class', 'river-label').text(river.name + ' R.');
  });

  // ── Mountains ──
  const mtG = featuresGroup.append('g');

  // SVG defs for mountain gradients
  const defs = svgSel.select('defs').empty() ? svgSel.append('defs') : svgSel.select('defs');
  defs.append('linearGradient').attr('id','mtL').attr('x1','0').attr('y1','0').attr('x2','0').attr('y2','1')
    .selectAll('stop').data([{o:'0%',c:'#3d5c32'},{o:'100%',c:'#556e47'}]).join('stop')
    .attr('offset', d=>d.o).attr('stop-color', d=>d.c);
  defs.append('linearGradient').attr('id','mtR').attr('x1','0').attr('y1','0').attr('x2','0').attr('y2','1')
    .selectAll('stop').data([{o:'0%',c:'#85a862'},{o:'100%',c:'#5a7e44'}]).join('stop')
    .attr('offset', d=>d.o).attr('stop-color', d=>d.c);

  MOUNTAINS_DATA.forEach(range => {
    range.peaks.forEach(coord => {
      const px = projection(coord);
      if (!px || isNaN(px[0])) return;
      drawMountainIcon(mtG, px[0], px[1], 10);
    });
    const lp = projection(range.labelCoord);
    if (lp && !isNaN(lp[0]))
      mtG.append('text').attr('x', lp[0]).attr('y', lp[1])
        .attr('class', 'mountain-label').text(range.name);
  });
}

function drawMountainIcon(g, cx, cy, s) {
  // Ground shadow
  g.append('ellipse')
    .attr('cx', cx + s*0.08).attr('cy', cy + s*0.32)
    .attr('rx', s*0.95).attr('ry', s*0.17)
    .attr('fill', 'rgba(0,0,0,0.22)');
  // Left (shadow) face
  g.append('polygon')
    .attr('points', `${cx},${cy-s} ${cx-s},${cy+s*0.32} ${cx},${cy+s*0.32}`)
    .attr('fill', 'url(#mtL)');
  // Right (lit) face
  g.append('polygon')
    .attr('points', `${cx},${cy-s} ${cx},${cy+s*0.32} ${cx+s},${cy+s*0.32}`)
    .attr('fill', 'url(#mtR)');
  // Ridge line
  g.append('line')
    .attr('x1', cx).attr('y1', cy - s)
    .attr('x2', cx).attr('y2', cy + s*0.32)
    .attr('stroke', 'rgba(0,0,0,0.1)').attr('stroke-width', 0.4);
  // Snow cap — left
  g.append('polygon')
    .attr('points', `${cx},${cy-s} ${cx-s*0.3},${cy-s*0.52} ${cx},${cy-s*0.52}`)
    .attr('fill', '#cce8cc');
  // Snow cap — right
  g.append('polygon')
    .attr('points', `${cx},${cy-s} ${cx},${cy-s*0.52} ${cx+s*0.3},${cy-s*0.52}`)
    .attr('fill', '#f0faf0');
  // Peak highlight dot
  g.append('circle')
    .attr('cx', cx).attr('cy', cy - s + 1)
    .attr('r', 0.8).attr('fill', '#ffffff').attr('opacity', 0.7);
}

function toggleFeatures() {
  featuresVisible = !featuresVisible;
  d3.select('#features-layer').style('display', featuresVisible ? null : 'none');
  const btn = document.getElementById('feat-btn');
  if (btn) btn.classList.toggle('active', featuresVisible);
}
